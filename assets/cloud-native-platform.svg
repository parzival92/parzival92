<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc" fill="none">
  <title id="title">Cloud native platform pipeline</title>
  <desc id="desc">Animated platform pipeline from Git source through CI/CD and infrastructure as code into a Kubernetes runtime with Grafana and Prometheus observability.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060d18"/>
      <stop offset="0.5" stop-color="#0b1a2c"/>
      <stop offset="1" stop-color="#0e2236"/>
    </linearGradient>
    <linearGradient id="rail" x1="80" y1="0" x2="824" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .card { fill: rgba(13, 24, 40, 0.92); stroke: rgba(148, 163, 184, 0.22); }
      .kicker { font: 600 11px ui-sans-serif, system-ui, "Segoe UI", sans-serif; letter-spacing: .16em; fill: #7f93a8; }
      .name { font: 600 14px ui-sans-serif, system-ui, "Segoe UI", sans-serif; fill: #e8eef6; }
      .cap { font: 500 12px ui-sans-serif, system-ui, "Segoe UI", sans-serif; letter-spacing: .05em; fill: #93a4b8; }
      .tag { font: 700 13px ui-sans-serif, system-ui, "Segoe UI", sans-serif; letter-spacing: .04em; fill: #cfe0f0; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="900" height="280" rx="24" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#7dd3fc" stroke-width="1">
    <g>
      <path d="M0 56H900M0 112H900M0 168H900M0 224H900"/>
      <path d="M60 0V280M180 0V280M300 0V280M420 0V280M540 0V280M660 0V280M780 0V280M840 0V280"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 56;0 0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- header -->
  <text x="44" y="44" class="tag">Platform delivery pipeline</text>
  <g fill="#34d399">
    <circle cx="845" cy="40" r="3"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="833" cy="40" r="3" fill="#f59e0b"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="821" cy="40" r="3" fill="#38bdf8"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- connecting rail (behind the cards) -->
  <path id="track" d="M96 150 H816"/>
  <path d="M96 150 H816" stroke="url(#rail)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="140" to="0" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- traveling packets -->
  <g>
    <circle r="3.2" fill="#38bdf8"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#track"/></animateMotion></circle>
    <circle r="3.2" fill="#34d399"><animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#track"/></animateMotion></circle>
    <circle r="3.2" fill="#f59e0b"><animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite"><mpath href="#track"/></animateMotion></circle>
  </g>

  <!-- ===== node: Git source ===== -->
  <g transform="translate(96 150)">
    <rect class="card" x="-58" y="-46" width="116" height="92" rx="16"/>
    <text class="kicker" x="0" y="-28" text-anchor="middle">SOURCE</text>
    <g stroke="#38bdf8" stroke-width="2.6" fill="none" filter="url(#glow)">
      <circle cx="-11" cy="-6" r="4.5" fill="#0b1a2c"/>
      <circle cx="-11" cy="14" r="4.5" fill="#0b1a2c"/>
      <circle cx="13" cy="-6" r="4.5" fill="#0b1a2c"/>
      <path d="M-11 -1.5 V9.5"/>
      <path d="M-6.5 -6 H8.5"/>
      <path d="M13 -1.5 C13 8, 4 8, -6.5 12" stroke-dasharray="1.5 4">
        <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <text class="name" x="0" y="38" text-anchor="middle">Git</text>
  </g>

  <!-- ===== node: CI/CD ===== -->
  <g transform="translate(276 150)">
    <rect class="card" x="-58" y="-46" width="116" height="92" rx="16"/>
    <text class="kicker" x="0" y="-28" text-anchor="middle">CI / CD</text>
    <g filter="url(#glow)">
      <g fill="none" stroke="#818cf8" stroke-width="2.6" stroke-linecap="round">
        <path d="M2 -14 A14 14 0 1 1 -14 2"/>
        <path d="M-2 14 A14 14 0 1 1 14 -2"/>
      </g>
      <path d="M2 -14 l-7 -3 l1 8 z" fill="#818cf8"/>
      <path d="M-2 14 l7 3 l-1 -8 z" fill="#818cf8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
    <text class="name" x="0" y="38" text-anchor="middle">Pipelines</text>
  </g>

  <!-- ===== node: IaC ===== -->
  <g transform="translate(456 150)">
    <rect class="card" x="-58" y="-46" width="116" height="92" rx="16"/>
    <text class="kicker" x="0" y="-28" text-anchor="middle">INFRA AS CODE</text>
    <g stroke="#7c5cff" stroke-width="2" filter="url(#glow)">
      <path d="M-16 -2 L0 -10 L16 -2 L0 6 Z" fill="rgba(124,92,255,.18)"/>
      <path d="M-16 5 L0 -3 L16 5 L0 13 Z" fill="rgba(124,92,255,.30)">
        <animate attributeName="opacity" values=".55;1;.55" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <text class="name" x="0" y="38" text-anchor="middle">Bicep · Terraform</text>
  </g>

  <!-- ===== node: Kubernetes (hub) ===== -->
  <circle cx="636" cy="150" r="64" fill="url(#hub)"/>
  <g transform="translate(636 150)">
    <rect x="-62" y="-50" width="124" height="100" rx="18" fill="rgba(8,32,52,.94)" stroke="rgba(52,211,153,.55)" stroke-width="1.4"/>
    <text class="kicker" x="0" y="-30" text-anchor="middle" fill="#7fe7c4">RUNTIME</text>
    <g filter="url(#glow)" stroke="#34d399" stroke-width="2.4" fill="none">
      <g>
        <polygon points="0,-18 14.06,-11.21 17.53,4 7.81,16.2 -7.81,16.2 -17.53,4 -14.06,-11.21" fill="rgba(52,211,153,.10)"/>
        <path d="M0 0 L0 -18 M0 0 L14.06 -11.21 M0 0 L17.53 4 M0 0 L7.81 16.2 M0 0 L-7.81 16.2 M0 0 L-17.53 4 M0 0 L-14.06 -11.21" stroke-width="1.6" opacity=".85"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      </g>
      <circle cx="0" cy="0" r="3.4" fill="#34d399"/>
    </g>
    <text class="name" x="0" y="40" text-anchor="middle">Kubernetes</text>
  </g>

  <!-- ===== node: Observability ===== -->
  <g transform="translate(816 150)">
    <rect class="card" x="-58" y="-46" width="116" height="92" rx="16"/>
    <text class="kicker" x="0" y="-28" text-anchor="middle">OBSERVABILITY</text>
    <g filter="url(#glow)">
      <path d="M-18 14 H18" stroke="rgba(148,163,184,.4)" stroke-width="1.4"/>
      <path d="M-18 10 L-8 2 L-1 8 L8 -8 L18 -12" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="3" fill="#f59e0b">
        <animateMotion dur="3.6s" repeatCount="indefinite" path="M-18 10 L-8 2 L-1 8 L8 -8 L18 -12"/>
        <animate attributeName="r" values="2.6;4.4;2.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text class="name" x="0" y="38" text-anchor="middle">Grafana · Prom</text>
  </g>

  <!-- footer caption -->
  <text x="450" y="256" text-anchor="middle" class="cap">Azure platforms · Flux GitOps · Kubernetes operations · observability that teams use</text>
</svg>
