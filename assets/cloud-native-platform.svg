<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Cloud native platform animation</title>
  <desc id="desc">Animated cloud native platform diagram showing Azure, GitOps, Kubernetes, Grafana observability, and infrastructure as code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0d2036"/>
      <stop offset="1" stop-color="#12263a"/>
    </linearGradient>
    <linearGradient id="line" x1="80" y1="130" x2="820" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.22 0 0 0 0 0.75 0 0 0 0 0.95 0 0 0 0.7 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font: 600 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e5edf5; }
      .small { font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9fb2c7; letter-spacing: .04em; }
      .chip { fill: rgba(15, 23, 42, .84); stroke: rgba(148, 163, 184, .24); }
      .wire { stroke: url(#line); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 12; }
    </style>
  </defs>

  <rect width="900" height="260" rx="24" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#7dd3fc" stroke-width="1">
    <path d="M0 44H900M0 88H900M0 132H900M0 176H900M0 220H900"/>
    <path d="M72 0V260M144 0V260M216 0V260M288 0V260M360 0V260M432 0V260M504 0V260M576 0V260M648 0V260M720 0V260M792 0V260M864 0V260"/>
  </g>

  <path class="wire" d="M145 132 C245 74, 315 74, 405 132 S565 190, 665 132 S765 74, 835 132">
    <animate attributeName="stroke-dashoffset" from="160" to="0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path class="wire" opacity="0.55" d="M145 132 C260 196, 340 196, 450 132 S640 68, 755 132">
    <animate attributeName="stroke-dashoffset" from="0" to="160" dur="7s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(64 76)">
    <rect class="chip" width="164" height="108" rx="18"/>
    <text class="small" x="82" y="30" text-anchor="middle">CLOUD</text>
    <text class="label" x="82" y="60" text-anchor="middle">Azure</text>
    <text class="small" x="82" y="83" text-anchor="middle">network identity platform</text>
    <circle cx="136" cy="26" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(266 76)">
    <rect class="chip" width="164" height="108" rx="18"/>
    <text class="small" x="82" y="30" text-anchor="middle">DELIVERY</text>
    <text class="label" x="82" y="60" text-anchor="middle">GitOps</text>
    <text class="small" x="82" y="83" text-anchor="middle">Flux Kustomize CI/CD</text>
    <circle cx="136" cy="26" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;.35;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(468 58)" filter="url(#glow)">
    <rect width="190" height="144" rx="22" fill="rgba(8, 47, 73, .88)" stroke="rgba(125, 211, 252, .55)"/>
    <text class="small" x="95" y="34" text-anchor="middle">RUNTIME</text>
    <text class="label" x="95" y="66" text-anchor="middle">Kubernetes</text>
    <g transform="translate(42 86)">
      <circle cx="0" cy="0" r="14" fill="#38bdf8" opacity=".9"/>
      <circle cx="53" cy="0" r="14" fill="#34d399" opacity=".9"/>
      <circle cx="106" cy="0" r="14" fill="#f59e0b" opacity=".9"/>
      <path d="M14 0H39M67 0H92" stroke="#dbeafe" stroke-width="3" stroke-linecap="round" opacity=".72"/>
      <animateTransform attributeName="transform" type="translate" values="42 86;42 82;42 86" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(698 48)">
    <rect class="chip" width="156" height="74" rx="18"/>
    <text class="small" x="78" y="27" text-anchor="middle">INSIGHT</text>
    <text class="label" x="78" y="53" text-anchor="middle">Grafana</text>
  </g>
  <g transform="translate(698 144)">
    <rect class="chip" width="156" height="74" rx="18"/>
    <text class="small" x="78" y="27" text-anchor="middle">AUTOMATION</text>
    <text class="label" x="78" y="53" text-anchor="middle">IaC + Flux</text>
  </g>

  <g opacity="0.9">
    <circle cx="145" cy="132" r="6" fill="#38bdf8">
      <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="348" cy="132" r="6" fill="#34d399">
      <animate attributeName="r" values="6;10;6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="563" cy="132" r="6" fill="#7dd3fc">
      <animate attributeName="r" values="5;9;5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="756" cy="132" r="6" fill="#f59e0b">
      <animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="450" y="236" text-anchor="middle" class="small">Azure Kubernetes platforms | Flux delivery | Grafana observability</text>
</svg>
